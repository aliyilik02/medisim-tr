name: Test

on:
  push:
    branches:
      - master
      - 'fix/**'
      - 'feature/**'
      - 'feat/**'
      - 'claude/**'
      - 'test-**'
  pull_request:
    # Tüm hedef branch'lere açılan PR'larda çalışsın (master + feat/backend-cf-worker)
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # 'npm ci' Node sürüm farklılıklarında lock tree çözümleme sorunu
        # yaratıyor. 'npm install --no-audit --no-fund --prefer-offline' daha
        # esnek; lock değişikliğini CI'da committemiyoruz.
        run: npm install --no-audit --no-fund --prefer-offline

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # 'npm ci' Node sürüm farklılıklarında lock tree çözümleme sorunu
        # yaratıyor. 'npm install --no-audit --no-fund --prefer-offline' daha
        # esnek; lock değişikliğini CI'da committemiyoruz.
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run E2E smoke tests
        run: npm run test:e2e
        env:
          CI: 'true'
        timeout-minutes: 10

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
