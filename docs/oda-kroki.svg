<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="Geist, Arial, sans-serif">
  <!-- Ölçek: 100 px = 1 m. Oda 5.0 m (x) × 4.0 m (z), tavan 2.6 m. Kuşbakışı. -->
  <rect width="760" height="640" fill="#0f0f11"/>
  <text x="380" y="30" fill="#e5e5de" font-size="18" text-anchor="middle">Acil Resüsitasyon Odası — Kuşbakışı Kroki (TASLAK)</text>
  <text x="380" y="50" fill="#8a8a85" font-size="12" text-anchor="middle">5.0 × 4.0 m · tavan 2.6 m · 1 kare = 0.5 m · MediSim TR v2 oda önerisi</text>

  <g transform="translate(130,90)">
    <!-- ızgara 0.5 m -->
    <g stroke="#1c1c1f" stroke-width="1">
      <path d="M50 0V400M100 0V400M150 0V400M200 0V400M250 0V400M300 0V400M350 0V400M400 0V400M450 0V400"/>
      <path d="M0 50H500M0 100H500M0 150H500M0 200H500M0 250H500M0 300H500M0 350H500"/>
    </g>
    <!-- duvarlar -->
    <rect x="0" y="0" width="500" height="400" fill="none" stroke="#b8b8b0" stroke-width="6"/>
    <text x="250" y="-10" fill="#8a8a85" font-size="11" text-anchor="middle">BAŞ UCU DUVARI (gaz paneli / tavan pendant)</text>
    <text x="370" y="420" fill="#8a8a85" font-size="11" text-anchor="middle">AYAK UCU DUVARI</text>

    <!-- tavan pendantı / gaz paneli -->
    <rect x="185" y="6" width="130" height="22" fill="#26262a" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="250" y="21" fill="#2dd4bf" font-size="10" text-anchor="middle">O₂ · Hava · Vakum · Priz ×8</text>

    <!-- hasta sedyesi (0.9 × 2.1 m), baş duvardan 0.6 m -->
    <rect x="205" y="60" width="90" height="210" rx="8" fill="#26262a" stroke="#e5e5de" stroke-width="2"/>
    <rect x="215" y="66" width="70" height="40" rx="6" fill="#3a3a3f"/>
    <text x="250" y="150" fill="#e5e5de" font-size="11" text-anchor="middle">SEDYE</text>
    <text x="250" y="164" fill="#8a8a85" font-size="9" text-anchor="middle">baş kısmı 30–45°</text>
    <text x="250" y="176" fill="#8a8a85" font-size="9" text-anchor="middle">kalkabilir</text>
    <circle cx="250" cy="86" r="11" fill="none" stroke="#f5f5f0" stroke-width="1.5"/>

    <!-- hasta başı monitörü (kollu, hastanın sağı = çizimde sol) -->
    <rect x="120" y="40" width="60" height="38" fill="#141416" stroke="#10b981" stroke-width="2"/>
    <text x="150" y="58" fill="#10b981" font-size="10" text-anchor="middle">MONİTÖR</text>
    <text x="150" y="70" fill="#8a8a85" font-size="8" text-anchor="middle">duvar kolu</text>

    <!-- ventilatör (baş ucu, hastanın solu) -->
    <rect x="325" y="40" width="55" height="55" fill="#141416" stroke="#60a5fa" stroke-width="2"/>
    <text x="352" y="65" fill="#60a5fa" font-size="10" text-anchor="middle">VENTİLATÖR</text>
    <text x="352" y="78" fill="#8a8a85" font-size="8" text-anchor="middle">+ aspiratör</text>

    <!-- havayolu arabası (baş arkası, sağ) -->
    <rect x="120" y="95" width="55" height="45" fill="#141416" stroke="#f59e0b" stroke-width="2"/>
    <text x="147" y="114" fill="#f59e0b" font-size="9" text-anchor="middle">HAVAYOLU</text>
    <text x="147" y="126" fill="#f59e0b" font-size="9" text-anchor="middle">ARABASI</text>

    <!-- IV askısı + infüzyon pompası (hastanın sağı, omuz hizası) -->
    <circle cx="185" cy="155" r="10" fill="none" stroke="#e5e5de" stroke-width="2"/>
    <text x="150" y="175" fill="#e5e5de" font-size="9" text-anchor="middle">IV askısı +</text>
    <text x="150" y="186" fill="#e5e5de" font-size="9" text-anchor="middle">infüzyon pompası</text>

    <!-- acil arabası + defibrilatör (hastanın sağı, ayak tarafı) -->
    <rect x="110" y="215" width="70" height="55" fill="#141416" stroke="#ef4444" stroke-width="2"/>
    <text x="145" y="237" fill="#ef4444" font-size="10" text-anchor="middle">ACİL ARABASI</text>
    <text x="145" y="250" fill="#ef4444" font-size="9" text-anchor="middle">+ defibrilatör</text>

    <!-- EKG cihazı (hastanın solu, gövde hizası) -->
    <rect x="325" y="150" width="50" height="40" fill="#141416" stroke="#a78bfa" stroke-width="2"/>
    <text x="350" y="168" fill="#a78bfa" font-size="9" text-anchor="middle">12-DER.</text>
    <text x="350" y="180" fill="#a78bfa" font-size="9" text-anchor="middle">EKG</text>

    <!-- USG / EKO (hastanın solu, ayak tarafı) -->
    <rect x="325" y="215" width="50" height="45" fill="#141416" stroke="#a78bfa" stroke-width="2"/>
    <text x="350" y="236" fill="#a78bfa" font-size="9" text-anchor="middle">USG/EKO</text>

    <!-- çalışma tezgâhı + malzeme dolabı (sol duvar = hastanın solu) -->
    <rect x="440" y="40" width="55" height="250" fill="#1c1c1f" stroke="#8a8a85" stroke-width="1.5"/>
    <text x="467" y="150" fill="#b8b8b0" font-size="10" text-anchor="middle" transform="rotate(90 467 150)">TEZGÂH + MALZEME DOLABI</text>

    <!-- ilaç / kan gazı (sağ duvar) -->
    <rect x="6" y="40" width="50" height="120" fill="#1c1c1f" stroke="#8a8a85" stroke-width="1.5"/>
    <text x="31" y="100" fill="#b8b8b0" font-size="10" text-anchor="middle" transform="rotate(-90 31 100)">İLAÇ DOLABI</text>
    <rect x="6" y="180" width="50" height="50" fill="#1c1c1f" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="31" y="203" fill="#a78bfa" font-size="8" text-anchor="middle">KAN</text>
    <text x="31" y="214" fill="#a78bfa" font-size="8" text-anchor="middle">GAZI</text>

    <!-- lavabo + eldiven + kesici atık (ayak ucu, kapı yanı) -->
    <rect x="400" y="350" width="80" height="44" fill="#1c1c1f" stroke="#8a8a85" stroke-width="1.5"/>
    <text x="440" y="370" fill="#b8b8b0" font-size="9" text-anchor="middle">LAVABO</text>
    <text x="440" y="382" fill="#8a8a85" font-size="8" text-anchor="middle">eldiven · atık</text>

    <!-- kapı (ayak ucu, ortada-sağ, 1.4 m çift kanat) -->
    <rect x="120" y="394" width="140" height="10" fill="#0f0f11"/>
    <path d="M120 400 A70 70 0 0 0 190 330" fill="none" stroke="#5c5c63" stroke-dasharray="4 3"/>
    <path d="M260 400 A70 70 0 0 1 190 330" fill="none" stroke="#5c5c63" stroke-dasharray="4 3"/>
    <text x="190" y="390" fill="#8a8a85" font-size="10" text-anchor="middle">KAPI 1.4 m</text>

    <!-- perde rayı (sedye çevresi, kesikli) -->
    <rect x="100" y="34" width="290" height="300" fill="none" stroke="#5c5c63" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="388" y="330" fill="#5c5c63" font-size="9" text-anchor="end">perde rayı</text>

    <!-- ekip pozisyonları -->
    <g font-size="10" font-weight="bold">
      <circle cx="250" cy="45" r="9" fill="#0d9488"/><text x="250" y="49" fill="#0f0f11" text-anchor="middle">1</text>
      <circle cx="195" cy="120" r="9" fill="#0d9488"/><text x="195" y="124" fill="#0f0f11" text-anchor="middle">2</text>
      <circle cx="305" cy="120" r="9" fill="#0d9488"/><text x="305" y="124" fill="#0f0f11" text-anchor="middle">3</text>
      <circle cx="250" cy="300" r="9" fill="#0d9488"/><text x="250" y="304" fill="#0f0f11" text-anchor="middle">4</text>
    </g>
  </g>

  <!-- lejant -->
  <g transform="translate(130,520)" font-size="11" fill="#b8b8b0">
    <text x="0" y="0">Ekip yeri: <tspan fill="#2dd4bf">1</tspan> havayolu (baş) · <tspan fill="#2dd4bf">2</tspan> dolaşım/IV (hastanın sağı) · <tspan fill="#2dd4bf">3</tspan> prosedür/EKG (hastanın solu) · <tspan fill="#2dd4bf">4</tspan> ekip lideri (ayak ucu)</text>
    <text x="0" y="20">Çizimde SOL = hastanın SAĞI (hasta sırtüstü, başı üst duvarda). Öğrenci kamerası: ayak ucu (4) ve sağ yan (2).</text>
    <text x="0" y="40" fill="#8a8a85">Mevcut sahneden fark: sedye ortada, baş duvara dönük · monitör baş ucunda · kapı ayak ucunda · tavan ayrı.</text>
    <text x="0" y="60" fill="#f59e0b">TASLAK — Ali Bey onayı olmadan oda parçası üretilmez.</text>
  </g>
</svg>
